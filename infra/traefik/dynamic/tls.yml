# Serve the wildcard cert (generated by scripts/gen-cert.sh, or drop in your own as
# wildcard.crt/wildcard.key) as the default cert for every websecure router.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/wildcard.crt
        keyFile: /etc/traefik/certs/wildcard.key
